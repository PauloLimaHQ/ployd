<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ployd — a forked branch: one prompt, parallel runs">
  <!--
    Ployd app icon — master artwork.
    The mark is the "y" of the wordmark drawn as a git graph: one stem (the
    prompt you queue) forks into two branches (the agent runs working in
    parallel), and each branch ends in a node (the result you review). The tip
    nodes use the board's own accent (#d97757) so the icon and the UI match.

    macOS icon grid: 1024x1024 canvas, 824x824 rounded "squircle" centered
    (100px margin all around), corner radius 185.4 (0.225 * 824). Transparent
    margins on purpose: macOS does not auto-mask app icons, so the shape is
    baked in here. Regenerate every raster size with build/make-icons.sh.
  -->
  <defs>
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E2925"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A27C"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <clipPath id="plate">
      <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"/>
    </clipPath>
  </defs>

  <!-- Back plane -->
  <g clip-path="url(#plate)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>

  <!-- The fork: stem + two branches, one continuous stroke weight -->
  <g stroke="#F4E8DA" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M512 748 L512 560"/>
    <path d="M512 560 C512 440 336 452 336 330"/>
    <path d="M512 560 C512 440 688 452 688 330"/>
  </g>

  <!-- Origin node: the prompt the runs fork from -->
  <circle cx="512" cy="748" r="50" fill="#F4E8DA"/>

  <!-- Tip nodes: the results, in the board's accent -->
  <circle cx="336" cy="300" r="78" fill="url(#node)"/>
  <circle cx="688" cy="300" r="78" fill="url(#node)"/>
</svg>
