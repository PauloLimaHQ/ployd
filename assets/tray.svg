<svg width="1024" height="1024" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ployd menu-bar glyph">
  <!--
    macOS menu-bar (tray) glyph — a TEMPLATE image: single-color art on a
    transparent canvas that macOS/Electron recolor to match the menu bar
    (light/dark/selected). The same forked "y" as the app icon, with a heavier
    stroke and bigger tip nodes so it still reads at the @2x (36px) size shown on
    Retina Macs. The origin node is dropped here: at 18pt it only thickens the
    stem's end. build/make-icons.sh renders it.
  -->
  <g stroke="#000" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M50 86 L50 58"/>
    <path d="M50 58 C50 44 27 46 27 32"/>
    <path d="M50 58 C50 44 73 46 73 32"/>
  </g>
  <circle cx="27" cy="25" r="12" fill="#000"/>
  <circle cx="73" cy="25" r="12" fill="#000"/>
</svg>
